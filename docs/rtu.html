<style>
:root{--bg:#f7f8fa;--panel:#fff;--panel-2:#f4f6f9;--ink:#0d1117;--ink-2:#31383f;--muted:#697585;--line:#e3e7ee;--line-2:#d2d8e2;
 --accent:#4a57c9;--on-accent:#fff;--accent-soft:#eceefb;--bad:#c0362c;--bad-soft:#fdecea;--ok:#12855c;
 --wash:rgba(74,87,201,.10);--gridc:rgba(13,17,23,.045);--shadow:0 2px 4px rgba(16,24,40,.04),0 16px 40px -12px rgba(16,24,40,.18);
 --ease:cubic-bezier(.16,1,.3,1);--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#08090b;--panel:#101214;--panel-2:#16181c;--ink:#e8eaed;--ink-2:#c4c9d1;--muted:#858c98;--line:#2a2e35;--line-2:#353a42;
 --accent:#8b93f8;--on-accent:#0a0b0e;--accent-soft:#171a2e;--bad:#ff8d84;--bad-soft:#2a1513;--ok:#4cc38a;
 --wash:rgba(139,147,248,.16);--gridc:rgba(255,255,255,.035);--shadow:0 2px 6px rgba(0,0,0,.45),0 16px 40px -12px rgba(0,0,0,.7)}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.005em;display:grid;place-items:center;min-height:100%;padding:24px 16px}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none}
body::before{z-index:-2;background:radial-gradient(62% 44% at 50% -12%,var(--wash),transparent 68%),radial-gradient(38% 30% at 96% -4%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 70%)}
body::after{z-index:-1;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:46px 46px;
 -webkit-mask-image:radial-gradient(78% 55% at 50% 0%,#000,transparent 76%);mask-image:radial-gradient(78% 55% at 50% 0%,#000,transparent 76%)}
@keyframes panelIn{from{opacity:0;transform:translateY(14px) scale(.99);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
@keyframes panelOut{to{opacity:0;transform:translateY(-8px) scale(.985);filter:blur(2px)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sweep{0%{background-position:-40% 0}100%{background-position:150% 0}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.kart{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 26px 22px;position:relative;overflow:hidden;animation:panelIn .55s var(--ease) both}
.kart::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent) no-repeat;background-size:40% 100%;opacity:0}
.kart.yukleniyor::before{opacity:1;animation:sweep 1.1s var(--ease) infinite}
.kart.sars{animation:shake .45s ease both}
.kart.cikis{animation:panelOut .3s var(--ease) both}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo svg{width:44px;height:44px;flex:none}
.logo svg circle{fill:var(--accent);animation:glow 2.4s ease-in-out infinite}
.logo svg circle:nth-child(2n){animation-delay:.3s}.logo svg circle:nth-child(3n){animation-delay:.6s}
h1{font-size:20px;font-weight:650;letter-spacing:-.025em;margin:0;line-height:1.2}
.alt{color:var(--muted);font-size:12.5px;margin-top:2px}
p.acik{color:var(--ink-2);margin:0 0 16px;font-size:13.5px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
.alan{position:relative;margin-bottom:14px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 42px 10px 12px;outline:none;transition:border-color .16s,box-shadow .16s,background .16s}
input:hover{border-color:var(--line-2)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);background:var(--panel)}
.goz{position:absolute;right:6px;bottom:6px;width:32px;height:30px;border:0;background:transparent;color:var(--muted);border-radius:7px;cursor:pointer;display:grid;place-items:center}
.goz:hover{background:var(--accent-soft);color:var(--accent)}
.goz svg{width:18px;height:18px}
button.ana{width:100%;font:inherit;font-weight:600;font-size:14.5px;padding:11px 14px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;transition:transform .12s,filter .18s}
button.ana:hover{filter:brightness(1.07);transform:translateY(-1px)}
button.ana:disabled{opacity:.7;cursor:progress;transform:none}
.hata{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--bad)}
.bag{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);gap:10px}
.bag a,.bag button{font:inherit;font-size:12.5px;border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 0;text-decoration:none}
.bag a:hover,.bag button:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="kart" id="kart" aria-labelledby="bas">
  <div class="logo">
    <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="8" r="3.4"></circle><circle cx="16" cy="18" r="3.4"></circle><circle cx="28" cy="18" r="3.4"></circle><circle cx="10" cy="28" r="3.4"></circle><circle cx="22" cy="28" r="3.4"></circle><circle cx="34" cy="28" r="3.4"></circle><circle cx="4" cy="38" r="3.4"></circle><circle cx="16" cy="38" r="3.4"></circle><circle cx="28" cy="38" r="3.4"></circle><circle cx="40" cy="38" r="3.4"></circle></svg>
    <div><h1 id="bas">Araçlarım</h1><div class="alt">Bu araç şifreli</div></div>
  </div>
  <form id="giris" autocomplete="off">
    <p class="acik">Açmak için şifrenizi girin.</p>
    <div class="alan"><label for="sifre">Şifre</label><input id="sifre" type="password" autocomplete="current-password" required autofocus>
      <button type="button" class="goz" data-hedef="sifre" aria-label="Şifreyi göster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
    <button class="ana" id="gir" type="submit">Giriş</button>
    <div class="hata" id="hata" role="alert" aria-live="polite"></div>
  </form>
  <div class="bag"><span>İçerik AES-256 ile şifreli</span><a href="index.html">← Ana sayfa</a></div>
</main>

<script>
(function(){
'use strict';
/* Hesap Merkezi ile aynı şifreleme: PBKDF2-SHA256 → AES-256-GCM, içerik gzip.
   Tüm dosyalar hesap-merkezi.html'in salt'ı ile şifrelenir; bu yüzden anahtar tek kez türetilir
   ve sekme oturumunda (sessionStorage) Hesap Merkezi'nin kullandığı adla saklanır — bir kez girilen
   şifre ana sayfada, araçlarda ve Hesap Merkezi'nde geçerli olur. */
var $=function(id){return document.getElementById(id);};
var SKEY='hesapMerkezi_oturum';
function b64d(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function b64e(u){var s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function destek(){return !!(window.crypto&&crypto.subtle&&window.DecompressionStream);}
var VERI=$('hm-data'),SALT=b64d(VERI.dataset.salt),IV=b64d(VERI.dataset.iv),ITER=+VERI.dataset.iter;
async function anahtarBitleri(pw){var baz=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:SALT,iterations:ITER},baz,256));}
function SifreHatasi(){this.name='SifreHatasi';}
async function coz(bits){var k=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']),gz;
  try{gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:IV},k,b64d(VERI.textContent.replace(/\s+/g,'')));}catch(_){throw new SifreHatasi();}
  var s=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(s).text();}
function kayitliAnahtar(){try{var k=sessionStorage.getItem(SKEY);return k?b64d(k):null;}catch(_){return null;}}
function anahtarKaydet(bits){try{sessionStorage.setItem(SKEY,b64e(bits));}catch(_){}}
function anahtarSil(){try{sessionStorage.removeItem(SKEY);}catch(_){}}
function hata(msg){$('hata').textContent=msg;}
function yukle(on){$('kart').classList.toggle('yukleniyor',on);$('gir').disabled=on;$('gir').textContent=on?'Açılıyor…':'Giriş';}
function sars(){var k=$('kart');k.classList.remove('sars');void k.offsetWidth;k.classList.add('sars');}
document.querySelectorAll('.goz').forEach(function(b){b.addEventListener('click',function(){var i=$(b.dataset.hedef);var g=i.type==='password';i.type=g?'text':'password';b.setAttribute('aria-label',g?'Şifreyi gizle':'Şifreyi göster');i.focus();});});

/* ac(bits, metin, otomatik): şifresi çözülmüş içerikle ne yapılacağı (sayfaya göre değişir).
   gizle: kayıtlı oturum denenirken giriş kartı gösterilmesin (küçük içerik anında açılır). */
function girisBagla(ac,gizle){
  if(!destek()){hata('Bu tarayıcı şifre çözmeyi desteklemiyor. Güncel Chrome, Edge, Firefox veya Safari ile açın.');$('gir').disabled=true;return;}
  (async function(){var k=kayitliAnahtar();if(!k)return;yukle(true);if(gizle)$('kart').style.visibility='hidden';
    try{await ac(k,await coz(k),true);}catch(e){anahtarSil();yukle(false);$('kart').style.visibility='';$('sifre').focus();}})();
  $('giris').addEventListener('submit',async function(e){e.preventDefault();var pw=$('sifre').value;if(!pw)return;hata('');yukle(true);
    try{var bits=await anahtarBitleri(pw),metin=await coz(bits);anahtarKaydet(bits);await ac(bits,metin,false);}
    catch(x){yukle(false);if(x instanceof SifreHatasi){hata('Şifre yanlış.');sars();$('sifre').select();}else hata('Açılamadı: '+(x&&x.message||x));}});
}
girisBagla(async function(bits,html){document.open();document.write(html);document.close();});
})();
</script>
